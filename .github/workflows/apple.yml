name: 铁牛社区 Apple 双端构建

# 🔴 为什么这件事非得在云端做：
#    ipa / .app **只能在 macOS 上编译**（Xcode 只有 macOS 版）。开发这台机器是 Windows，
#    连 swiftc 都没有 ⇒ 「编译通过」这个信号在本机永远拿不到。
#    公开仓库的 macos runner 免费 ⇒ 推上来点一下就出包。
#
# 一次运行出两个平台的产物：
#    · TieniuForum-<ver>-unsigned.ipa      iOS，**未签名** —— 用 AltStore / Sideloadly / Scarlet 自签安装
#    · TieniuForum-<ver>.dmg / -mac.zip    macOS，**ad-hoc 已签名** —— 双击即用
#    · version-ios.json / version-macos.json   必须和包**一起发**，客户端「关于程序」读它（铁律 94 的 Apple 版）
#
# 怎么发出去（二选一）：
#    ① 直接在 run 页面下载 artifact；
#    ② 把包 + json 放进论坛服务器的 /update/ 目录（客户端会自动发现新版本）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空 = 读工程里的 MARKETING_VERSION）"
        required: false
        default: ""
      notes:
        description: "更新说明（留空 = 读 release_notes-<平台>.txt）"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # 0) 预检：把「有没有签名材料」变成一个 job 输出
  #    🔴 job 级的 if **读不到 secrets** ⇒ 只能先在这里算成字符串再传出去，
  #       否则写法只能是「缺了 secret 直接失败」，而不是「优雅跳过」。
  # ══════════════════════════════════════════════════════════════════════
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      signed: ${{ steps.chk.outputs.signed }}
      version: ${{ steps.chk.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: chk
        name: 检查签名材料 / 解析版本号
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROV: ${{ secrets.IOS_PROVISION_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$P12" ] && [ -n "$P12_PASS" ] && [ -n "$PROV" ] && [ -n "$TEAM" ]; then
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(awk -F'"' '/^[[:space:]]*MARKETING_VERSION:/{print $2; exit}' ios-build/project.yml)
          fi
          if [ -z "$V" ]; then
            echo "::error::解析不出 MARKETING_VERSION，检查 ios-build/project.yml"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "版本号    : $V"
          echo "签名材料  : $([ -n "$P12" ] && echo 有 || echo 无)"

  # ══════════════════════════════════════════════════════════════════════
  # 1) iOS：未签名 ipa（没有 Apple 开发者账号也能出包）
  # ══════════════════════════════════════════════════════════════════════
  ios:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程（并确保当前 Xcode 读得懂）
        working-directory: ios-build
        run: |
          set -euo pipefail
          echo "--- runner 上装了哪些 Xcode ---"
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "${XC:-}" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version

          xcodegen generate

          # 🔴 这一步是「跑一次就废一个 run」的守门员：
          #    XcodeGen 新版写的是 **Xcode 16 的工程格式（objectVersion 77）**，
          #    而 runner 上装的老 Xcode（macos-14 只有 15.4）会**当场拒绝读**：
          #      xcodebuild: error: Unable to read project 'TieniuForum.xcodeproj'
          #        Reason: … it is in a future Xcode project file format (77)
          #    现象是 job 20 秒就红，而且报错只在 xcodebuild 那一步。
          #    ⇒ 生成后**先试着读一次**；读不了就把格式标记降级到 56（Xcode 14/15 通用格式）。
          #      XcodeGen 生成的是传统 PBXGroup 结构、没有 77 专属对象 ⇒ 降级是安全的。
          PBX=TieniuForum.xcodeproj/project.pbxproj
          OV() { grep -m1E '^[[:space:]]*objectVersion' "$PBX" | tr -dc 0-9; }
          echo "objectVersion = $(OV)"
          if xcodebuild -list -project TieniuForum.xcodeproj >/dev/null 2>&1; then
            echo "✅ 当前 Xcode 能读这个工程"
          else
            echo "::warning::当前 Xcode 读不了 objectVersion=$(OV)，降级到 56 后重试"
            sed -i '' -E \
              -e 's/^([[:space:]]*)objectVersion = [0-9]*;/\1objectVersion = 56;/' \
              -e '/^[[:space:]]*preferredProjectObjectVersion = [0-9]*;[[:space:]]*$/d' \
              -e '/^[[:space:]]*minimizedProjectReferenceProxies = 1;[[:space:]]*$/d' "$PBX"
            echo "降级后 objectVersion = $(OV)"
            xcodebuild -list -project TieniuForum.xcodeproj >/dev/null
            echo "✅ 降级后能读了"
          fi

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          V="${{ needs.preflight.outputs.version }}"
          if [ -z "$V" ]; then
            V=$(awk -F'"' '/^[[:space:]]*MARKETING_VERSION:/{print $2; exit}' ios-build/project.yml)
          fi
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V"

      - name: xcodebuild archive（未签名）
        working-directory: ios-build
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project TieniuForum.xcodeproj \
            -scheme TieniuForum \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TieniuForum.xcarchive" \
            MARKETING_VERSION="${{ steps.ver.outputs.ver }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO

      # 🔴 这一步是「静默错」的守门员：
      #    Info.plist 里但凡有两个 key 挤在同一行，YAML 会把值读成
      #    「铁牛社区        CFBundleName: TieniuForum」，**编译照样通过**，
      #    只是手机桌面上图标名字变成一串乱码 —— 不主动查就发现不了。
      - name: 自检 Info.plist（显示名 / 版本号）
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/TieniuForum.xcarchive/Products/Applications/TieniuForum.app"
          echo "--- 归档产物 ---"
          ls -la "$RUNNER_TEMP/TieniuForum.xcarchive/Products/Applications/"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "CFBundleDisplayName        = $NAME"
          echo "CFBundleShortVersionString = $VER"
          case "$NAME" in
            *CFBundle*|*": "*)
              echo "::error::显示名里混进了别的东西：[$NAME] —— 大概率是 project.yml 里两个 key 挤在同一行"
              exit 1;;
          esac
          [ "$NAME" = "铁牛社区" ] || echo "::warning::显示名不是「铁牛社区」：[$NAME]"
          [ "$VER" = "${{ steps.ver.outputs.ver }}" ] || echo "::warning::版本号与预期不一致：$VER"
          test -f "$APP/AppIcon60x60@2x.png" || ls "$APP"/*.png 2>/dev/null | head -5 || true
          echo "--- 图标是否真的打进去了 ---"
          ls -la "$APP" | grep -i "AppIcon" || echo "::warning::没在 .app 根目录看到 AppIcon*.png"

      - name: 装进 Payload 打成 ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/TieniuForum.xcarchive/Products/Applications/TieniuForum.app"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          IPA="TieniuForum-${{ steps.ver.outputs.ver }}-unsigned.ipa"
          zip -qry "$IPA" Payload
          rm -rf Payload
          ls -lh "$IPA"
          echo "--- ipa 内部结构（头 20 行）---"
          unzip -l "$IPA" | head -20

      - name: 生成 version-ios.json
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          python3 tools/make_version_json.py --platform ios \
            --file "TieniuForum-${{ steps.ver.outputs.ver }}-unsigned.ipa" \
            --version "${{ steps.ver.outputs.ver }}" \
            --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: tieniu-ios-${{ steps.ver.outputs.ver }}
          path: |
            TieniuForum-*-unsigned.ipa
            version-ios.json
          if-no-files-found: error
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════
  # 2) macOS：.app → dmg + zip（ad-hoc 签名）
  #    🔴 Apple Silicon 上**未签名的二进制会被系统直接杀掉**（不是弹警告，是秒退），
  #       所以 macOS 没有「完全不签名也能出包」这条路，必须 ad-hoc。
  # ══════════════════════════════════════════════════════════════════════
  macos:
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程（并确保当前 Xcode 读得懂）
        working-directory: macos-build
        # ⚠️ 必须 cd 进来再 generate：project.yml 里的 Sources/Resources 是相对
        #    **它自己所在目录**解析的，用 --spec 从别处调容易和 XcodeGen 的基准目录对不上。
        run: |
          set -euo pipefail
          echo "--- runner 上装了哪些 Xcode ---"
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "${XC:-}" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version

          xcodegen generate

          # 🔴 同上（ios 作业里有完整说明）：XcodeGen 写的是 Xcode 16 的
          #    objectVersion 77，老 Xcode 会当场拒绝读 ⇒ 读不了就把格式标记降级到 56。
          PBX=TieniuForumMac.xcodeproj/project.pbxproj
          OV() { grep -m1E '^[[:space:]]*objectVersion' "$PBX" | tr -dc 0-9; }
          echo "objectVersion = $(OV)"
          if xcodebuild -list -project TieniuForumMac.xcodeproj >/dev/null 2>&1; then
            echo "✅ 当前 Xcode 能读这个工程"
          else
            echo "::warning::当前 Xcode 读不了 objectVersion=$(OV)，降级到 56 后重试"
            sed -i '' -E \
              -e 's/^([[:space:]]*)objectVersion = [0-9]*;/\1objectVersion = 56;/' \
              -e '/^[[:space:]]*preferredProjectObjectVersion = [0-9]*;[[:space:]]*$/d' \
              -e '/^[[:space:]]*minimizedProjectReferenceProxies = 1;[[:space:]]*$/d' "$PBX"
            echo "降级后 objectVersion = $(OV)"
            xcodebuild -list -project TieniuForumMac.xcodeproj >/dev/null
            echo "✅ 降级后能读了"
          fi

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          V="${{ needs.preflight.outputs.version }}"
          if [ -z "$V" ]; then
            V=$(awk -F'"' '/^[[:space:]]*MARKETING_VERSION:/{print $2; exit}' macos-build/project.yml)
          fi
          echo "ver=$V" >> "$GITHUB_OUTPUT"
          echo "版本号: $V"

      - name: xcodebuild（Release，通用二进制，ad-hoc 签名）
        working-directory: macos-build
        run: |
          set -euo pipefail
          xcodebuild \
            -project TieniuForumMac.xcodeproj \
            -scheme TieniuForumMac \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION="${{ steps.ver.outputs.ver }}" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: 自检 Info.plist / 架构 / 签名
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release/TieniuForum.app"
          test -d "$APP" || { echo "::error::没找到 .app：$APP"; ls -R "$RUNNER_TEMP/dd/Build/Products" | head -40; exit 1; }
          NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Contents/Info.plist")
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist")
          echo "CFBundleDisplayName        = $NAME"
          echo "CFBundleShortVersionString = $VER"
          case "$NAME" in
            *CFBundle*|*": "*)
              echo "::error::显示名里混进了别的东西：[$NAME] —— 大概率是 project.yml 里两个 key 挤在同一行"
              exit 1;;
          esac
          echo "--- 架构（应当同时有 arm64 与 x86_64）---"
          lipo -archs "$APP/Contents/MacOS/TieniuForum"
          echo "--- 签名（ad-hoc 时 Authority 会显示 Sign to Run Locally）---"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -10
          codesign --verify --verbose=2 "$APP" && echo "签名校验通过"
          echo "--- 图标 ---"
          ls -la "$APP/Contents/Resources/" | grep -i "icns\|AppIcon" || echo "::warning::没看到 icns"

      - name: 打 dmg + zip
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release/TieniuForum.app"
          VER="${{ steps.ver.outputs.ver }}"
          # 再 ad-hoc 签一次（保证 build 产物在任何情况下签名都是完整的）
          codesign --force --sign - "$APP"
          # dmg：UDZO = zlib 压缩，体积和兼容性最平衡
          hdiutil create -volname "铁牛社区" -srcfolder "$APP" -ov -format UDZO \
            "TieniuForum-${VER}.dmg"
          # zip：ditto 会保留符号链接与权限位（普通 zip 会把 .app 打坏）
          ditto -c -k --sequesterRsrc --keepParent "$APP" "TieniuForum-${VER}-mac.zip"
          ls -lh "TieniuForum-${VER}.dmg" "TieniuForum-${VER}-mac.zip"
          echo "--- 挂载 dmg 验一遍（挂不上就是坏包）---"
          MP=$(hdiutil attach "TieniuForum-${VER}.dmg" -nobrowse -readonly | tail -1 | awk '{$1="";$2="";print substr($0,3)}')
          echo "挂载点: $MP"
          ls -la "$MP"
          hdiutil detach "$MP"

      - name: 生成 version-macos.json
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          python3 tools/make_version_json.py --platform macos \
            --file "TieniuForum-${{ steps.ver.outputs.ver }}.dmg" \
            --version "${{ steps.ver.outputs.ver }}" \
            --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: tieniu-macos-${{ steps.ver.outputs.ver }}
          path: |
            TieniuForum-*.dmg
            TieniuForum-*-mac.zip
            version-macos.json
          if-no-files-found: error
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════
  # 3) 正式签名版（可选）：只有仓库里配了 4 个 secrets 才跑
  #    配了就走 exportArchive 出**已签名**的 ipa（能直接 AltStore / Ad Hoc 分发）。
  #    没配就整体跳过 —— 不会把没账号的人卡在红叉上。
  # ══════════════════════════════════════════════════════════════════════
  signed:
    needs: [preflight, ios]
    if: needs.preflight.outputs.signed == 'yes'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程（并确保当前 Xcode 读得懂）
        working-directory: ios-build
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          [ -n "${XC:-}" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcodegen generate
          # 老 Xcode 读不了 Xcode 16 的工程格式（objectVersion 77）⇒ 降级到 56
          PBX=TieniuForum.xcodeproj/project.pbxproj
          OV() { grep -m1E '^[[:space:]]*objectVersion' "$PBX" | tr -dc 0-9; }
          if ! xcodebuild -list -project TieniuForum.xcodeproj >/dev/null 2>&1; then
            echo "::warning::当前 Xcode 读不了 objectVersion=$(OV)，降级到 56 后重试"
            sed -i '' -E \
              -e 's/^([[:space:]]*)objectVersion = [0-9]*;/\1objectVersion = 56;/' \
              -e '/^[[:space:]]*preferredProjectObjectVersion = [0-9]*;[[:space:]]*$/d' \
              -e '/^[[:space:]]*minimizedProjectReferenceProxies = 1;[[:space:]]*$/d' "$PBX"
            xcodebuild -list -project TieniuForum.xcodeproj >/dev/null
          fi
          echo "objectVersion = $(OV)（已被当前 Xcode 读取 ✅）"

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          V="${{ needs.preflight.outputs.version }}"
          if [ -z "$V" ]; then
            V=$(awk -F'"' '/^[[:space:]]*MARKETING_VERSION:/{print $2; exit}' ios-build/project.yml)
          fi
          echo "ver=$V" >> "$GITHUB_OUTPUT"

      - name: 导入证书与描述文件
        env:
          P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROV: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          set -euo pipefail
          # 🔴 别写 `base64 -d`：macOS 自带的是 BSD base64，解 base64 要用 -D，
          #    `-d` 会直接报错并让整个 job 挂掉。统一用 python3 解，跨平台行为一致。
          printf '%s' "$P12"  | python3 -c "import sys,base64;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read().strip()))" > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$PROV" | python3 -c "import sys,base64;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read().strip()))" > "$RUNNER_TEMP/profile.mobileprovision"

          KEYCHAIN_PW="$(uuidgen)"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          # 🔴 不加这一句，codesign 会在「想用私钥」时弹 GUI 授权框，
          #    在无人值守的 runner 上表现为「卡住直到超时」。
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "--- 身份 ---"
          security find-identity -v -p codesigning "$KEYCHAIN" || true

      - name: 写 ExportOptions.plist
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>$TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          cat ExportOptions.plist

      - name: archive + exportArchive（正式签名）
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
          PROFILE: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cd ios-build
          xcodebuild archive \
            -project TieniuForum.xcodeproj \
            -scheme TieniuForum \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/TieniuForum-signed.xcarchive" \
            MARKETING_VERSION="${{ steps.ver.outputs.ver }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" \
            -allowProvisioningUpdates

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/TieniuForum-signed.xcarchive" \
            -exportOptionsPlist ../ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates

          echo "--- 导出结果 ---"
          ls -lh "$RUNNER_TEMP/export"
          cp "$RUNNER_TEMP/export/"*.ipa "TieniuForum-${{ steps.ver.outputs.ver }}.ipa"
          ls -lh "TieniuForum-${{ steps.ver.outputs.ver }}.ipa"

      - name: 生成 version-ios.json（已签名版）
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          python3 tools/make_version_json.py --platform ios \
            --file "TieniuForum-${{ steps.ver.outputs.ver }}.ipa" \
            --version "${{ steps.ver.outputs.ver }}" \
            --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: tieniu-ios-signed-${{ steps.ver.outputs.ver }}
          path: |
            TieniuForum-${{ steps.ver.outputs.ver }}.ipa
            version-ios.json
          if-no-files-found: error
          retention-days: 30
